<!--
  Die Ansage liegt über der Bühne in der oberen rechten Ecke und blendet nach
  ein paar Sekunden aus: Sie steht mitten im Bild, und wer sie gelesen oder
  gehört hat, will danach die Wiese sehen und nicht den Kasten.
-->
<header
  class="pokemon-catch__intro"
  [class.pokemon-catch__intro--verblasst]="!introVisible()"
  [attr.aria-hidden]="introVisible() ? null : 'true'"
>
  <div class="pokemon-catch__intro-box">
    <qst-read-aloud-button [text]="intro()" [audioUrl]="introAudioUrl()" />
    <p>{{ intro() }}</p>
  </div>
</header>

<div #stage class="pokemon-catch__stage">
  <div class="pokemon-catch__lane">
    @if (!caught()) {
      <!--
        Das Ziel steht auf einem von drei Plätzen und springt alle paar Sekunden
        auf einen anderen — es läuft nicht durch. Welcher Platz gilt, entscheidet
        die Komponente; das Stylesheet weiß nur, wo links, Mitte und rechts liegen.
      -->
      <div
        #target
        class="pokemon-catch__target"
        [class.pokemon-catch__target--links]="targetSlot() === 'links'"
        [class.pokemon-catch__target--mitte]="targetSlot() === 'mitte'"
        [class.pokemon-catch__target--rechts]="targetSlot() === 'rechts'"
      >
        <qst-image-slot [src]="targetSpriteUrl()" [label]="targetName()" fit="contain" />
      </div>
    }
  </div>

  <!--
    Der Ball selbst ist die Spielfläche: anfassen, zurückziehen, wegwischen.
    `touch-action` liegt im Stylesheet — ohne das scrollt der Browser die Seite,
    statt den Ball mitzunehmen.
  -->
  <div
    #ball
    class="pokemon-catch__ball"
    [class.pokemon-catch__ball--haelt]="holding()"
    [class.pokemon-catch__ball--geworfen]="flying() || caught()"
    (pointerdown)="onBallPointerDown($event)"
    (animationend)="onFlightEnd($event)"
  >
    <div
      class="pokemon-catch__ball-body"
      [class.pokemon-catch__ball-body--faengt]="caught()"
      (animationend)="onCatchEnd($event)"
    >
      <qst-image-slot [src]="ballUrl()" [label]="config().ball" fit="contain" />

      <!--
        Bewusst ein schlichtes Bild statt qst-image-slot: Diese Ebene ist reine
        Deko und liegt über dem Ball — ein beschrifteter Platzhalter würde beim
        Blinken den Ball verdecken. Fehlt die Datei, verschwindet die Ebene und
        alles andere läuft weiter (README-Kontrakt). Sie steht von Anfang an im
        Rahmen, damit sie geladen ist, bevor die Fangsequenz startet.
      -->
      @if (blinkUrl(); as url) {
        <img
          class="pokemon-catch__ball-blink"
          [src]="url"
          alt=""
          aria-hidden="true"
          draggable="false"
          (error)="markBlinkFailed()"
        />
      }
    </div>
  </div>
</div>

<footer class="pokemon-catch__footer">
  <!--
    Der Bereich bleibt immer im Rahmen — ein Vorleseprogramm meldet Änderungen
    nur an einer Stelle, die es schon kennt. Der Kasten drumherum kommt und geht
    mit dem Text, sonst steht während der Fangsequenz eine leere Fläche da.
  -->
  <p class="pokemon-catch__message" role="status" aria-live="polite">
    @if (message(); as text) {
      <span class="pokemon-catch__message-box">{{ text }}</span>
    }
  </p>

  @if (celebrated()) {
    <button type="button" class="pokemon-catch__next" (click)="finish()">Weiter</button>
  } @else if (!caught()) {
    <!--
      Bewusst nicht gesperrt, solange ein Ball fliegt: ein gesperrter Knopf
      verliert den Tastatur-Fokus, und das Kind käme nach dem ersten Wurf mit
      der Leertaste nicht mehr weiter. Den zweiten Wurf hält der Zustand ab.
    -->
    <button type="button" class="pokemon-catch__throw" (click)="throwBall()">Ball werfen</button>
  }
</footer>
