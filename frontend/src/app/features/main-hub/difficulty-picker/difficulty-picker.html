<fieldset class="difficulty-picker__group">
  <legend class="difficulty-picker__legend">
    Lernstufe
    <span
      class="difficulty-picker__info"
      role="img"
      tabindex="0"
      [attr.aria-label]="explanation"
      [title]="explanation"
      >i</span
    >
  </legend>

  <div class="difficulty-picker__options">
    @for (card of cards(); track card.id) {
      <label class="difficulty-picker__option">
        <input
          class="visually-hidden"
          type="radio"
          name="difficulty-level"
          [value]="card.id"
          [checked]="card.id === selectedLevelId()"
          (change)="chosen.emit(card.id)"
        />
        <span class="difficulty-picker__card" [attr.data-tier]="card.tier">
          @if (card.imageUrl !== null) {
            <span class="difficulty-picker__image">
              <qst-image-slot [src]="card.imageUrl" [label]="card.imageLabel" [fit]="'contain'" />
            </span>
          }

          <span class="difficulty-picker__name">{{ card.label }}</span>

          <span class="difficulty-picker__pips" aria-hidden="true">
            @for (pip of card.pips; track pip) {
              <span
                class="difficulty-picker__pip"
                [class.difficulty-picker__pip--on]="pip <= card.rank"
              ></span>
            }
          </span>
          <span class="visually-hidden">Stufe {{ card.rank }} von {{ card.pips.length }}</span>

          @if (card.description !== null) {
            <span class="difficulty-picker__description">{{ card.description }}</span>
          }
          @if (card.imageLabel.length > 0) {
            <span class="visually-hidden">Bild: {{ card.imageLabel }}</span>
          }
        </span>
      </label>
    }
  </div>
</fieldset>
