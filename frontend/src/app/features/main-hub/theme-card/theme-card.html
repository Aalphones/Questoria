<button
  type="button"
  class="theme-card__button"
  [class.theme-card__button--active]="active()"
  (click)="chosen.emit(theme().id)"
>
  <span class="theme-card__cover">
    <qst-image-slot [src]="coverUrl(theme())" [label]="theme().cover" />
  </span>
  <span class="theme-card__label">
    <span class="theme-card__title">{{ theme().title }}</span>
    <span class="theme-card__status">{{ status() }}</span>
  </span>
</button>
