<qst-hud [backLink]="['/theme', themeId(), 'timeline']" [worldTitle]="world()?.title ?? null" />

@if (world(); as loadedWorld) {
  <p class="map__placeholder">Ortskarte „{{ mapId() }}" von „{{ loadedWorld.title }}" — wird noch gebaut.</p>
} @else {
  <qst-content-error message="Diese Welt konnte nicht geladen werden." />
}
