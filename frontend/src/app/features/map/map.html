<qst-hud [backLink]="['/theme', themeId(), 'timeline']" [worldTitle]="world()?.title ?? null" [levelLabel]="levelLabel()" />

@if (world(); as loadedWorld) {
  @if (mapEntry(); as loadedMap) {
    <div class="map">
      <qst-map-canvas
        class="map__canvas"
        [tiles]="tiles()"
        [unlockedTileIds]="unlockedTileIds()"
        [points]="points()"
        [routes]="loadedMap.routes"
        [dimmedPointIds]="lockedNodeIds()"
        [focusPointId]="focusNodeId()"
      >
        @for (node of loadedMap.nodes; track node.id) {
          <qst-map-point [x]="pointX(node.tile_id, node.x)" [y]="pointY(node.tile_id, node.y)">
            @if (node.episode_ref; as episodeRef) {
              @if (isReachable(node.id)) {
                <a class="map__node-wrapper" [routerLink]="['/theme', themeId(), 'episode', episodeRef]">
                  <img
                    class="map__node-image"
                    [class.map__node-image--done]="stateOf(node.id) === 'done'"
                    [class.map__node-image--current]="stateOf(node.id) === 'current'"
                    [src]="nodeImageUrl(node.illustration)"
                    [alt]="node.illustration_label"
                  />
                  <span class="map__label">{{ node.name }}</span>
                </a>
              } @else {
                <div class="map__node-wrapper">
                  <img
                    class="map__node-image map__node-image--locked"
                    [src]="nodeImageUrl(node.illustration)"
                    [alt]="node.illustration_label"
                  />
                  <span class="map__label">{{ node.name }}</span>
                </div>
              }
            } @else {
              <button
                type="button"
                class="map__node-wrapper map__node-wrapper--hint"
                (click)="openHint(node.hint_text, hintDialog)"
              >
                <img class="map__node-image" [src]="nodeImageUrl(node.illustration)" [alt]="node.illustration_label" />
                <span class="map__label">{{ node.name }}</span>
              </button>
            }
          </qst-map-point>
        }

        <div class="map__compass" aria-hidden="true">
          <span class="map__compass-label map__compass-label--n">N</span>
          <span class="map__compass-label map__compass-label--o">O</span>
          <span class="map__compass-label map__compass-label--s">S</span>
          <span class="map__compass-label map__compass-label--w">W</span>
          <span class="map__compass-needle"></span>
        </div>
      </qst-map-canvas>
    </div>

    <dialog #hintDialog class="map__hint-dialog">
      <p class="map__hint-text">{{ hintText() }}</p>
      <button type="button" class="map__hint-close" (click)="hintDialog.close()">Schließen</button>
    </dialog>
  } @else {
    <qst-content-error message="Diese Karte konnte nicht gefunden werden." />
  }
} @else {
  <qst-content-error message="Diese Welt konnte nicht geladen werden." />
}
