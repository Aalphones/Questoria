<qst-hud [backLink]="mapBackLink()" [worldTitle]="world()?.title ?? null" />

@if (world(); as loadedWorld) {
  <p class="location__placeholder">Ort „{{ episodeId() }}" von „{{ loadedWorld.title }}" — wird noch gebaut.</p>
} @else {
  <qst-content-error message="Diese Welt konnte nicht geladen werden." />
}
