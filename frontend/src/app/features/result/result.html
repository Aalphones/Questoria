<div class="result">
  <ul class="result__confetti" aria-hidden="true">
    @for (piece of confettiPieces; track piece) {
      <li class="result__confetti-piece"></li>
    }
  </ul>

  <ul class="result__stars" [attr.aria-label]="stars() + ' von 3 Sternen'">
    @for (starIndex of starIndexes; track starIndex) {
      <li class="result__star" [class.result__star--filled]="starIndex < stars()"></li>
    }
  </ul>

  <h2 class="result__title">Ort geschafft!</h2>

  <div class="result__hint">
    <qst-read-aloud-button [text]="hintText" />
    <p>{{ hintText }}</p>
  </div>

  <div class="result__stats">
    <div class="result__stat">
      <span class="result__stat-value">{{ correctAnswersLabel() }}</span>
      <span class="result__stat-label">Richtige Antworten</span>
    </div>
    <div class="result__stat">
      <span class="result__stat-value">{{ dialogLines() }}</span>
      <span class="result__stat-label">Dialogzeilen gehört</span>
    </div>
  </div>

  <div class="result__ctas">
    <a class="result__cta result__cta--primary" [routerLink]="mapLink()">Zurück zur Karte</a>
    <a class="result__cta result__cta--secondary" [routerLink]="timelineLink()">Zur Karte der Etappen</a>
  </div>
</div>
