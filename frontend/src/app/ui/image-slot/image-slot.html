@if (imageUrl(); as url) {
  <img
    class="image-slot__image"
    [class.image-slot__image--contain]="fit() === 'contain'"
    [ngSrc]="url"
    fill
    sizes="100vw"
    alt=""
    draggable="false"
    (error)="markFailed()"
  />
} @else {
  <span class="image-slot__placeholder">{{ label() }}</span>
}
