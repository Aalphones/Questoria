<header class="hud">
  @if (backLink(); as link) {
    <a class="hud__back" [routerLink]="link">
      <span class="hud__back-chevron" aria-hidden="true">‹</span>
      Zurück
    </a>
  }

  @if (worldTitle(); as title) {
    <span class="hud__world-title">{{ title }}</span>
  }

  <div class="hud__profile" #profileWrapper>
    <button
      type="button"
      #profileButton
      class="hud__profile-trigger"
      aria-haspopup="menu"
      [attr.aria-expanded]="profileMenuOpen()"
      (click)="toggleProfileMenu()"
    >
      @if (activeProfile(); as profile) {
        <span class="hud__profile-avatar" aria-hidden="true">
          @if (avatarUrl(); as url) {
            @if (!avatarFailed()) {
              <img
                class="hud__profile-avatar-image"
                [src]="url"
                alt=""
                (error)="markAvatarFailed()"
              />
            }
          }
        </span>
        {{ profile.display_name }}
      } @else {
        <span class="hud__profile-avatar" aria-hidden="true"></span>
        Gast
      }
    </button>

    @if (profileMenuOpen()) {
      <div class="hud__profile-menu" role="menu">
        <a
          class="hud__profile-menu-item"
          role="menuitem"
          routerLink="/profiles"
          (click)="closeProfileMenu()"
        >
          Profil wechseln
        </a>
        <button
          type="button"
          class="hud__profile-menu-item"
          role="menuitem"
          (click)="logout()"
        >
          Abmelden
        </button>
      </div>
    }
  </div>

  @if (levelLink(); as link) {
    <a
      class="hud__level"
      [routerLink]="link"
      [title]="levelExplanation"
      [attr.aria-label]="levelExplanation"
    >
      <span class="hud__level-marker" aria-hidden="true"></span>
      {{ levelLabel() ?? 'Stufe wählen' }}
    </a>
  }

  @if (progress(); as state) {
    <span class="hud__progress" [title]="progressExplanation" [attr.aria-label]="progressExplanation">
      <progress class="hud__progress-bar" [value]="state.done" [max]="state.total"></progress>
      <span class="hud__progress-label">{{ state.done }} von {{ state.total }} Orten</span>
    </span>
  }

  <div class="hud__mode" role="radiogroup" aria-label="Vorlesemodus">
    <button
      type="button"
      role="radio"
      class="hud__mode-option"
      [class.hud__mode-option--active]="mode() === 'listen'"
      [attr.aria-checked]="mode() === 'listen'"
      title="Bilder & Vorlesen liest dir alles vor"
      aria-label="Bilder & Vorlesen liest dir alles vor"
      (click)="setMode('listen')"
    >
      Bilder & Vorlesen
    </button>
    <button
      type="button"
      role="radio"
      class="hud__mode-option"
      [class.hud__mode-option--active]="mode() === 'read'"
      [attr.aria-checked]="mode() === 'read'"
      title="Selbst lesen"
      aria-label="Selbst lesen"
      (click)="setMode('read')"
    >
      Selbst lesen
    </button>
  </div>

  <button
    type="button"
    class="hud__sound"
    [class.hud__sound--off]="!soundOn()"
    [attr.aria-label]="soundOn() ? 'Ton ausschalten' : 'Ton einschalten'"
    [attr.title]="soundOn() ? 'Ton ausschalten' : 'Ton einschalten'"
    (click)="toggleSound()"
  >
    <svg
      class="hud__sound-icon"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.75"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
      @if (soundOn()) {
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
      } @else {
        <line x1="16" y1="9" x2="22" y2="15" />
        <line x1="22" y1="9" x2="16" y2="15" />
      }
    </svg>
  </button>

  <!-- Hier hängt der Karten-Knopf (Meilenstein 5) ein. Keine leeren
       Attrappen bauen — ein Knopf, der nichts tut, ist für ein Kind
       schlimmer als keiner. -->
</header>
